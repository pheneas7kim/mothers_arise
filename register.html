<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333333;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px;
      margin: 8px 0;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-field:focus {
      border-color: #007bff;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }

    .toggle-text {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #666666;
    }

    .toggle-text a {
      color: #007bff;
      text-decoration: none;
      font-weight: bold;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-box">
      
      <!-- LOGIN FORM -->
      <form id="login-form" class="input-group">
        <h2>Welcome Back</h2>
        <input type="text" id="login-identifier" class="input-field" placeholder="Username or Email" required>
        <input type="password" id="login-password" class="input-field" placeholder="Password" required>
        <button type="submit" class="submit-btn">Log In</button>
        <p class="toggle-text">Don't have an account? <a href="#" id="to-register">Register here</a></p>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="input-group hidden">
        <h2>Create Account</h2>
        <input type="text" id="reg-username" class="input-field" placeholder="Username" required>
        <input type="email" id="reg-email" class="input-field" placeholder="Email Address" required>
        <input type="tel" id="reg-phone" class="input-field" placeholder="Phone Number (e.g. 0712345678)" required>
        <input type="password" id="reg-password" class="input-field" placeholder="Password (min 6 chars)" required>
        <button type="submit" class="submit-btn">Register</button>
        <p class="toggle-text">Already have an account? <a href="#" id="to-login">Log in here</a></p>
      </form>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const toRegister = document.getElementById('to-register');
    const toLogin = document.getElementById('to-login');

    // Toggle Forms
    toRegister.addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
    });

    toLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
    });

    // Handle Login Submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      // Passes both email and username keys for dual support
      const payload = {
        username: identifier,
        email: identifier,
        password: password
      };

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/login/', {
          method: 'POST',
          headers: { 
            'Accept': 'application/json',
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          alert('Login successful!');
          if (data.access) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);
          }
        } else {
          console.error('Login Error:', data);
          alert('Login failed: ' + JSON.stringify(data));
        }
      } catch (error) {
        console.error('Error logging in:', error);
        alert('Could not connect to backend server.');
      }
    });

    // Handle Registration Submission
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const usernameInput = document.getElementById('reg-username').value.trim();
      const emailInput = document.getElementById('reg-email').value.trim();
      const phoneInput = document.getElementById('reg-phone').value.trim();
      const passwordInput = document.getElementById('reg-password').value;

      const payload = {
        username: usernameInput,
        email: emailInput,
        phone_number: phoneInput,
        password: passwordInput
      };

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/register/', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registration successful! Please log in.');
          registerForm.reset();
          registerForm.classList.add('hidden');
          loginForm.classList.remove('hidden');
        } else {
          console.error('Validation errors:', data);
          alert('Registration failed: ' + JSON.stringify(data));
        }
      } catch (error) {
        console.error('Fetch error:', error);
        alert('Failed to connect to backend server.');
      }
    });
  </script>
</body>
</html>s
